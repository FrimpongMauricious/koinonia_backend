# ── Production profile — active on Render via SPRING_PROFILES_ACTIVE=prod ─────
# All secrets come from environment variables; nothing sensitive is hardcoded.

# ── Database (Neon) ───────────────────────────────────────────────────────────
# HikariCP + PostgreSQL JDBC driver require credentials as separate properties,
# not embedded in the URL (jdbc:postgresql://user:pass@host/db is rejected).
# Set three env vars on Render:
#   DB_URL      = jdbc:postgresql://ep-xxx.aws.neon.tech/neondb?sslmode=require
#   DB_USERNAME = neondb_owner
#   DB_PASSWORD = <your neon password>
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# ── JPA / Hibernate ───────────────────────────────────────────────────────────
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
logging.level.org.hibernate.SQL=WARN

# ── Flyway ────────────────────────────────────────────────────────────────────
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# ── JWT ───────────────────────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=86400000

# ── CORS ──────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS}

# ── Actuator ──────────────────────────────────────────────────────────────────
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
